<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M5 17.5 L12 25 L27 7' stroke='%23da291c' stroke-width='5'/></svg>">
  <title>Mini Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none" style="display:block; margin:0 auto 12px;">
        <path d="M5 17.5 L12 25 L27 7" stroke="var(--primary)" stroke-width="5" stroke-linecap="butt"/>
    </svg>
    <h1>My Tasks</h1>
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <button id="addButton">Add Task</button>
    <ul id="taskList"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
